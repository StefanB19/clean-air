  :root{

    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    --bg-a:#EAFBF4; --bg-b:#E7F0FD; --bg-c:#F6EEFF;
    --blob1:#7FE7C4; --blob2:#9DBBFF; --blob3:#FFC1A6; --blob-op:.5;
    --ink:#15211C; --ink-soft:#4C5C56;
    --primary:#0FA588; --primary-2:#33E7C4; --primary-ink:#04211B;
    --accent:#FF6B7A; --accent-2:#FF9776; --accent-soft:rgba(255,107,122,.16); --accent-ink:#5A0E17;
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.72); --glass-border:rgba(255,255,255,.75);

      --ink:#F1F5F3; --ink-soft:#A9B4AF;
      --primary:#2FE7C0; --primary-2:#7CFFE0; --primary-ink:#04211B;
      --accent:#FF8FA0; --accent-2:#FFB199; --accent-soft:rgba(255,143,160,.18); --accent-ink:#FFE3E8;
      --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.11); --glass-border:rgba(255,255,255,.16);
      --line:rgba(255,255,255,.12);
      --shadow: 0 10px 44px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg-a:#0B1220; --bg-b:#10142A; --bg-c:#170F26;
    --blob1:#1FBF9E; --blob2:#5B7CFA; --blob3:#FF8F6B; --blob-op:.35;
    --ink:#F1F5F3; --ink-soft:#A9B4AF;
    --primary:#2FE7C0; --primary-2:#7CFFE0; --primary-ink:#04211B;
    --accent:#FF8FA0; --accent-2:#FFB199; --accent-soft:rgba(255,143,160,.18); --accent-ink:#FFE3E8;
    --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.11); --glass-border:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.12);
    --shadow: 0 10px 44px -14px rgba(0,0,0,.65);
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg-a:#EAFBF4; --bg-b:#E7F0FD; --bg-c:#F6EEFF;
    --blob1:#7FE7C4; --blob2:#9DBBFF; --blob3:#FFC1A6; --blob-op:.5;
    --ink:#15211C; --ink-soft:#4C5C56;
    --primary:#0FA588; --primary-2:#33E7C4; --primary-ink:#04211B;
    --accent:#FF6B7A; --accent-2:#FF9776; --accent-soft:rgba(255,107,122,.16); --accent-ink:#5A0E17;
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.72); --glass-border:rgba(255,255,255,.75);
    --line:rgba(21,33,28,.09);
    --shadow: 0 10px 40px -14px rgba(20,40,35,.28);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(160deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));color:var(--ink);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;}
  img{max-width:100%}
  [hidden]{display:none!important}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0;text-wrap:balance}
  .num{font-family:"Fraunces",Georgia,serif;font-variant-numeric:tabular-nums;}
  button{font-family:inherit}
  ul{margin:0;padding-left:18px;}

  .bg-mesh{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:var(--blob-op);}
  .blob.b1{width:60vmax;height:60vmax;top:-22%;left:-18%;background:var(--blob1);animation:float1 24s ease-in-out infinite;}
  .blob.b2{width:52vmax;height:52vmax;bottom:-22%;right:-14%;background:var(--blob2);animation:float2 28s ease-in-out infinite;}
  .blob.b3{width:42vmax;height:42vmax;top:28%;right:12%;background:var(--blob3);animation:float3 32s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(5%,7%) scale(1.06)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-6%,-5%) scale(1.05)}}
  @keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(-4%,6%) scale(1.08)}}
  @media (prefers-reduced-motion: reduce){ .blob{animation:none!important;} }

  #app{position:relative;z-index:1;}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 48px;}

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--glass);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border-bottom:1px solid var(--glass-border);
  }
  .top-inner{max-width:720px;margin:0 auto;padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.2px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px 1px var(--primary);}
  .brand-logo{height:32px;width:32px;border-radius:10px;display:block;box-shadow:0 3px 10px -3px rgba(0,0,0,.4);}
  .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .pill-btn{background:var(--glass-strong);border:1px solid var(--glass-border);color:var(--ink);
    font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;}
  .pill-btn:active{transform:scale(.96);}
  .whoami{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}

  .status-banner{padding:10px 16px;font-size:13px;text-align:center;position:relative;z-index:1;}
  .status-banner.warn{background:var(--accent-soft);color:var(--accent-ink);}

  .info-panel{padding:18px 20px;margin-top:14px;font-size:13.5px;line-height:1.65;color:var(--ink-soft);}
  .info-panel b{color:var(--ink);}

  .solo-hint{padding:14px 18px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;}

  section{margin-top:26px}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 10px}

  .glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:22px;
    box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);}

  .duo{display:flex;gap:12px;flex-wrap:wrap}
  .streak-card{flex:1 1 220px;padding:20px;position:relative;overflow:hidden;}
  .streak-card.me{border-color:color-mix(in srgb, var(--primary) 55%, var(--glass-border));box-shadow:0 0 0 1px color-mix(in srgb, var(--primary) 35%, transparent), var(--shadow);}
  .streak-card .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .streak-card .emoji{font-size:22px;line-height:1}
  .streak-card .badge-me{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--primary-ink);background:linear-gradient(135deg,var(--primary),var(--primary-2));
    padding:3px 8px;border-radius:99px}
  .streak-card .streaknum{font-size:46px;line-height:1;margin-top:14px;
    background:linear-gradient(135deg,var(--ink),var(--ink) 40%,var(--primary));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .streak-card .streaknum small{font-size:16px;font-weight:500;color:var(--ink-soft);margin-left:6px;-webkit-text-fill-color:var(--ink-soft);}
  .streak-card .since{font-size:12px;color:var(--ink-soft);margin-top:6px}
  .streak-card .best{font-size:12px;color:var(--ink-soft);margin-top:10px;display:flex;gap:5px;align-items:center}
  .subst-tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
  .subst-tag{font-size:11px;background:var(--glass-strong);border:1px solid var(--glass-border);
    padding:2px 8px;border-radius:99px;color:var(--ink-soft);}

  .combo{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .combo .tile{flex:1 1 160px;padding:14px 16px;}
  .combo .tile .v{font-size:24px}
  .combo .tile .l{font-size:12px;color:var(--ink-soft);margin-top:2px}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat-tile{padding:16px;}
  .stat-tile .v{font-size:26px;background:linear-gradient(135deg,var(--ink),var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat-tile .l{font-size:12px;color:var(--ink-soft);margin-top:4px}

  .milestones{display:flex;flex-direction:column;gap:0;overflow:hidden;}
  .m-row{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
  .m-row:last-child{border-bottom:none}
  .m-row.done{background:linear-gradient(90deg, color-mix(in srgb, var(--primary) 10%, transparent), transparent 60%)}
  .m-mark{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;
    justify-content:center;font-size:13px;margin-top:1px;
    background:var(--glass-strong);color:var(--ink-soft);border:1px solid var(--glass-border)}
  .m-row.done .m-mark{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--primary-ink);border-color:transparent}
  .m-label{font-weight:700;font-size:14px}
  .m-fact{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .m-eta{font-size:11px;color:var(--ink-soft);margin-top:3px;font-weight:600}

  .tips-block{padding:14px 18px;border-bottom:1px solid var(--line);}
  .tips-block:last-child{border-bottom:none;}
  .tips-block h4{font-size:13px;margin-bottom:8px;}
  .tips-block ul{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-soft);}

  .cheers{display:flex;flex-direction:column;gap:10px}
  .cheer-presets{display:flex;flex-wrap:wrap;gap:8px}
  .cheer-btn{border:1px solid var(--glass-border);background:var(--glass-strong);color:var(--ink);
    padding:9px 12px;border-radius:99px;font-size:13px;cursor:pointer}
  .cheer-btn:active{transform:scale(.97);}
  .cheer-feed{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .cheer-item{display:flex;gap:9px;font-size:13px;padding:10px 12px;align-items:center}
  .cheer-item .who{font-weight:700}
  .cheer-item .when{margin-left:auto;color:var(--ink-soft);font-size:11px;white-space:nowrap}
  .empty-note{font-size:13px;color:var(--ink-soft);padding:10px 2px}

  .danger-zone{margin-top:30px;border-top:1px dashed var(--line);padding-top:16px}
  .relapse-link{background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;
    cursor:pointer;padding:4px 0}
  .confirm-box{margin-top:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .confirm-box p{font-size:13px;margin:0;color:var(--ink-soft)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:none;border-radius:99px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--primary-ink);
    box-shadow:0 8px 24px -8px color-mix(in srgb, var(--primary) 60%, transparent);}
  .btn.primary:active{transform:scale(.98);}
  .btn.ghost{background:var(--glass-strong);color:var(--ink);border:1px solid var(--glass-border);}
  .btn.warn{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}

  .onboard{padding:24px;}
  .onboard h2{font-size:22px;margin-bottom:6px}
  .onboard p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px}
  .claim-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .claim-card{display:flex;align-items:center;gap:10px;border:1px solid var(--glass-border);border-radius:16px;
    padding:12px 14px;cursor:pointer;background:var(--glass-strong);text-align:left;width:100%}
  .claim-card:active{transform:scale(.99);}
  .claim-card .emoji{font-size:20px}
  .claim-card .meta{font-size:12px;color:var(--ink-soft);display:block}
  .claim-card strong{display:block;font-size:14px}
  .divider-or{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:11px;
    text-transform:uppercase;letter-spacing:.08em;margin:16px 0}
  .divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--line)}
  form.setup{display:flex;flex-direction:column;gap:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .field .hint{font-size:11.5px;color:var(--primary);margin-top:5px;font-weight:600}
  .field input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--glass-border);
    background:var(--glass-strong);color:var(--ink);font-size:15px;font-family:inherit}
  .field input:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .chip-check{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;
    border:1px solid var(--glass-border);background:var(--glass-strong);font-size:13px;cursor:pointer;}
  .chip-check input{margin:0;accent-color:var(--primary);}
  .emoji-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .emoji-input{width:64px;height:64px;border-radius:50%;text-align:center;font-size:28px;
    border:1px solid var(--glass-border);background:var(--glass-strong);cursor:pointer;flex:0 0 64px;
    display:flex;align-items:center;justify-content:center;padding:0;}
  .emoji-hint{font-size:12.5px;color:var(--ink-soft);flex:1 1 180px;min-width:0;}
  .quit-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .quit-row input{flex:1 1 200px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .saving-note{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--glass-strong);color:var(--ink);border:1px solid var(--glass-border);
    padding:9px 18px;border-radius:99px;font-size:12px;
    box-shadow:var(--shadow); z-index:20;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  footer.credit{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:30px}
  .setup-config{max-width:640px;margin:60px auto;padding:24px;font-size:14px;line-height:1.6}
  .setup-config code{background:var(--glass-strong);padding:2px 6px;border-radius:6px;font-size:13px}
  .setup-config pre{background:var(--glass-strong);padding:14px;border-radius:10px;overflow-x:auto;font-size:12.5px}
</style>
</head>

      html += '<div class="claim-list">';
      people.forEach(function(p){
        html += '<button type="button" class="claim-card" data-claim="'+p.id+'">' +
          '<span class="emoji">'+p.emoji+'</span>' +
          '<span><strong>'+esc(p.name)+'</strong><span class="meta">'+sinceLabel(p)+' '+fmtDate(p.quitDate)+'</span></span>' +
          '</button>';
      });
      html += '</div>';
      html += '<div class="divider-or">'+t("orDivider")+'</div>';
    }
    html += renderSetupForm(people.length === 0);
    html += '</div>';
    return html;
  }

  function renderSetupForm(first){
    var nowLocal = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
    var html = '<form class="setup" id="setup-form">';
    html += '<div class="field"><label>'+t("nameLabel")+'</label><input required id="f-name" placeholder="'+t("namePh")+'"></div>';
    html += '<div class="field"><label>'+t("emojiLabel")+'</label>';
    html += '<div class="emoji-row"><input id="f-emoji" class="emoji-input" value="'+EMOJIS_DEFAULT+'" maxlength="8" onfocus="this.select()"><span class="emoji-hint">'+t("emojiHint")+'</span></div>';
    html += '</div>';

    html += '<div class="field"><label>'+t("substancesLabel")+'</label><div class="row">';
    SUBST_KEYS.forEach(function(key){
      html += '<label class="chip-check"><input type="checkbox" class="subst-cb" value="'+key+'" '+(key==='cigs'?'checked':'')+'> '+substLabel(key)+'</label>';
    });
    html += '</div></div>';

    html += '<div class="field"><label>'+t("quitLabel")+'</label>';
    html += '<div class="quit-row"><input type="datetime-local" id="f-quitdate" value="'+nowLocal+'">';
    html += '<button type="button" class="btn ghost" id="quit-now-btn">'+t("quitNow")+'</button></div></div>';

    html += '<div id="cigs-fields"><div class="two-col">';
    html += '<div class="field"><label>'+t("cigsLabel")+'</label><input type="number" min="0" step="1" id="f-cigsday" value="20"><div class="hint" id="cigs-hint">'+t("cigsHintOne")+'</div></div>';
    html += '<div class="field"><label>'+t("costLabel")+'</label><input type="number" min="0" step="0.5" id="f-cost" value="30"></div>';
    html += '</div></div>';

    html += '<div id="heated-fields" hidden><div class="two-col">';
    html += '<div class="field"><label>'+t("heatedLabel")+'</label><input type="number" min="0" step="1" id="f-heatedday" value="20"><div class="hint" id="heated-hint">'+t("cigsHintOne")+'</div></div>';
    html += '<div class="field"><label>'+t("heatedCostLabel")+'</label><input type="number" min="0" step="0.5" id="f-heatedcost" value="30"></div>';
    html += '</div></div>';

    html += '<div id="vape-fields" hidden><div class="field"><label>'+t("vapeSpendLabel")+'</label><input type="number" min="0" step="5" id="f-vape" value="0"></div></div>';
    html += '<div id="weed-fields" hidden><div class="field"><label>'+t("weedSpendLabel")+'</label><input type="number" min="0" step="5" id="f-weed" value="0"></div></div>';

    html += '<button type="submit" class="btn primary">'+(first ? t("startBtn") : t("joinBtn"))+'</button>';
    html += '</form>';
    return html;
  }

  function renderDashboard(s, me, people){
    var html = "";

    html += '<section><p class="eyebrow">'+t("progress")+'</p><div class="duo">';
    people.forEach(function(p){
      html += renderStreakCard(p, p.id === me.id);
    });
    html += '</div>';

    if(people.length === 1){
      html += '<div class="glass solo-hint"><span>'+t("soloHint")+'</span>' +
        '<button type="button" class="btn primary" id="share-btn-2">🔗 '+t("invite")+'</button></div>';
    }

    if(people.length > 1){
      var total = 0, minStreak = Infinity;
      people.forEach(function(p){
        var d = elapsedParts(elapsedMs(p.quitDate)).days;
        total += d;
        if(d < minStreak) minStreak = d;
      });
      html += '<div class="combo">';
      html += '<div class="glass tile"><div class="num v">'+total+'</div><div class="l">'+t("comboTotal")+'</div></div>';
      html += '<div class="glass tile"><div class="num v">'+minStreak+'</div><div class="l">'+t("comboTeam")+'</div></div>';
      html += '</div>';
    }
    html += '</section>';

    html += '<section><p class="eyebrow">'+t("savings")+'</p><div class="stats-grid">';
    people.forEach(function(p){
      var subs = personSubstances(p);
      var days = elapsedMs(p.quitDate)/86400000;
      if(subs.indexOf("cigs")>-1){
        var cigs = days * (p.cigsPerDay||0);
        html += '<div class="glass stat-tile"><div class="num v">'+fmtNumber(cigs)+'</div><div class="l">'+t("cigsNotSmoked")+' &middot; '+p.emoji+' '+esc(p.name)+'</div></div>';
      }
      if(subs.indexOf("heated")>-1){
        var sticks = days * (p.heatedPerDay||0);
        html += '<div class="glass stat-tile"><div class="num v">'+fmtNumber(sticks)+'</div><div class="l">'+t("sticksNotUsed")+' &middot; '+p.emoji+' '+esc(p.name)+'</div></div>';
      }
      html += '<div class="glass stat-tile"><div class="num v">'+fmtNumber(moneySaved(p))+' lei</div><div class="l">'+t("moneySaved")+' &middot; '+p.emoji+' '+esc(p.name)+'</div></div>';
    });
    html += '</div></section>';

    html += '<section><p class="eyebrow">'+t("milestonesTitle")+'</p><div class="glass milestones">';
    var elapsed = elapsedMs(me.quitDate);
    personMilestones(me).forEach(function(m){
      var done = elapsed >= m.ms;
      html += '<div class="m-row '+(done?'done':'')+'">';
      html += '<div class="m-mark">'+(done?'✓':'')+'</div>';
      html += '<div><div class="m-label">'+(m.tag?m.tag+' ':'')+m.label+'</div><div class="m-fact">'+m.fact+'</div>';
      if(!done){
        var rem = elapsedParts(m.ms - elapsed);
        html += '<div class="m-eta">'+t("remaining",{d:rem.days,h:rem.hours})+'</div>';
      }
      html += '</div></div>';
    });
    html += '</div></section>';

    html += '<section><p class="eyebrow">'+t("tipsTitle")+'</p><div class="glass">';
    personSubstances(me).forEach(function(key){
      html += '<div class="tips-block"><h4>'+substLabel(key)+'</h4><ul>';
      (TIPS[lang][key]||[]).forEach(function(tip){ html += '<li>'+esc(tip)+'</li>'; });
      html += '</ul></div>';
    });
    html += '</div></section>';

    if(people.length > 1){
      var target = otherPeople()[0];
      html += '<section><p class="eyebrow">'+t("cheerTitle");
      if(target) html += ' '+t("cheerTo")+' ' + target.emoji + ' ' + esc(target.name);
      html += '</p><div class="cheers">';
      html += '<div class="cheer-presets">';
      presetCheers().forEach(function(c,i){
        html += '<button type="button" class="cheer-btn" data-cheer="'+i+'">'+c.e+' '+esc(c.t)+'</button>';
      });
      html += '</div>';
      var feed = s.cheers.slice(-5).reverse();
      html += '<div class="cheer-feed">';
      if(feed.length === 0){
        html += '<div class="empty-note">'+t("cheerEmpty")+'</div>';
      } else {
        feed.forEach(function(c){
          var fromP = s.people[c.from];
          html += '<div class="glass cheer-item"><span class="who">'+(fromP?fromP.emoji:'')+' '+esc(fromP?fromP.name:'?')+'</span>' +
            '<span>'+esc(c.msg)+'</span><span class="when">'+relTime(c.at)+'</span></div>';
        });
      }
      html += '</div></div></section>';
    }

    html += '<section><div class="empty-note">'+t("personalRecord")+': <strong>'+bestStreakDays(me.id)+' '+t("daysUnit")+'</strong></div></section>';

    html += '<div class="danger-zone" id="danger-zone">';
    html += '<button type="button" class="relapse-link" id="relapse-open">'+t("relapseLink")+'</button>';
    html += '<div id="relapse-confirm" hidden class="glass confirm-box">' +
      '<p>'+t("relapseText",{d:elapsedParts(elapsed).days})+'</p>' +
      '<div class="row"><button type="button" class="btn warn" id="relapse-confirm-btn">'+t("relapseConfirm")+'</button>' +
      '<button type="button" class="btn ghost" id="relapse-cancel-btn">'+t("relapseCancel")+'</button></div></div>';
    html += '</div>';

    return html;
  }

  function renderStreakCard(p, isMe){
    var parts = elapsedParts(elapsedMs(p.quitDate));
    var html = '<div class="glass streak-card '+(isMe?'me':'')+'">';
    html += '<div class="who"><span class="emoji">'+p.emoji+'</span> '+esc(p.name);
    if(isMe) html += ' <span class="badge-me">'+t("you")+'</span>';
    html += '</div>';
    html += '<div class="streaknum num">'+parts.days+'<small>'+t("daysUnit")+'</small></div>';
    html += '<div class="since">'+sinceLabel(p)+' '+fmtDate(p.quitDate)+'</div>';
    html += '<div class="subst-tags">';
    personSubstances(p).forEach(function(key){ html += '<span class="subst-tag">'+substLabel(key)+'</span>'; });
    html += '</div>';
    var best = bestStreakDays(p.id);
    if(best > parts.days) html += '<div class="best">🏆 '+t("record")+': '+best+' '+t("daysUnit")+'</div>';
    html += '</div>';
    return html;
  }

  // ---------- events ----------
  function doShare(btn){
    var url = location.href;
    function done(){
      btn.textContent = "✓ " + t("invited");
      setTimeout(function(){ btn.textContent = "🔗 " + t("invite"); }, 1500);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ window.prompt("Copy:", url); });
    } else {
      window.prompt("Copy:", url);
    }
  }

  function wireEvents(){
    var langBtn = document.getElementById("lang-btn");
    if(langBtn) langBtn.addEventListener("click", toggleLang);
    var themeBtn = document.getElementById("theme-btn");
    if(themeBtn) themeBtn.addEventListener("click", toggleTheme);
    var infoBtn = document.getElementById("info-btn");
    if(infoBtn) infoBtn.addEventListener("click", toggleInfo);
    var otherSpaceBtn = document.getElementById("other-space-btn");
    if(otherSpaceBtn) otherSpaceBtn.addEventListener("click", goToGate);

    var switchBtn = document.getElementById("switch-btn");
    if(switchBtn) switchBtn.addEventListener("click", function(){
      try{ localStorage.removeItem("aerCuratMyId_" + spaceId); }catch(e){}
      myId = null; render();
    });

    var shareBtn = document.getElementById("share-btn");
    if(shareBtn) shareBtn.addEventListener("click", function(){ doShare(shareBtn); });
    var shareBtn2 = document.getElementById("share-btn-2");
    if(shareBtn2) shareBtn2.addEventListener("click", function(){ doShare(shareBtn2); });

    document.querySelectorAll("[data-claim]").forEach(function(btn){
      btn.addEventListener("click", function(){
        myId = btn.getAttribute("data-claim");
        try{ localStorage.setItem("aerCuratMyId_" + spaceId, myId); }catch(e){}
        render();
      });
    });

    var quitNowBtn = document.getElementById("quit-now-btn");
    if(quitNowBtn) quitNowBtn.addEventListener("click", function(){
      var nowLocal = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
      document.getElementById("f-quitdate").value = nowLocal;
    });

    var cigsInput = document.getElementById("f-cigsday");
    if(cigsInput){
      cigsInput.addEventListener("input", function(){
        var n = Math.ceil((parseFloat(cigsInput.value)||0) / PACK_SIZE);
        var hintEl = document.getElementById("cigs-hint");
        if(hintEl) hintEl.textContent = n <= 1 ? t("cigsHintOne") : t("cigsHintMany",{n:n});
      });
    }
    var heatedInput = document.getElementById("f-heatedday");
    if(heatedInput){
      heatedInput.addEventListener("input", function(){
        var n = Math.ceil((parseFloat(heatedInput.value)||0) / PACK_SIZE);
        var hintEl = document.getElementById("heated-hint");
        if(hintEl) hintEl.textContent = n <= 1 ? t("cigsHintOne") : t("cigsHintMany",{n:n});
      });
    }

    document.querySelectorAll(".subst-cb").forEach(function(cb){
      cb.addEventListener("change", function(){
        var on = {};
        document.querySelectorAll(".subst-cb").forEach(function(x){ on[x.value] = x.checked; });
        var cf = document.getElementById("cigs-fields"); if(cf) cf.hidden = !on.cigs;
        var hf = document.getElementById("heated-fields"); if(hf) hf.hidden = !on.heated;
        var vf = document.getElementById("vape-fields"); if(vf) vf.hidden = !on.vape;
        var wf = document.getElementById("weed-fields"); if(wf) wf.hidden = !on.weed;
      });
    });

    var setupForm = document.getElementById("setup-form");
    if(setupForm){
      setupForm.addEventListener("submit", function(ev){
        ev.preventDefault();
        var name = document.getElementById("f-name").value.trim();
        if(!name) return;
        var substances = Array.from(document.querySelectorAll(".subst-cb:checked")).map(function(cb){ return cb.value; });
        if(substances.length === 0){ window.alert(t("pickOneSubstance")); return; }
        var emoji = document.getElementById("f-emoji").value.trim() || EMOJIS_DEFAULT;
        var quitLocal = document.getElementById("f-quitdate").value;
        var quitIso = quitLocal ? new Date(quitLocal).toISOString() : new Date().toISOString();
        var id = uid("p_");
        var person = {
          id: id, name: name, emoji: emoji,
          quitDate: quitIso,
          substances: substances,
          cigsPerDay: substances.indexOf("cigs")>-1 ? (parseFloat(document.getElementById("f-cigsday").value)||0) : 0,
          costPerPack: substances.indexOf("cigs")>-1 ? (parseFloat(document.getElementById("f-cost").value)||0) : 0,
          heatedPerDay: substances.indexOf("heated")>-1 ? (parseFloat(document.getElementById("f-heatedday").value)||0) : 0,
          heatedCostPerPack: substances.indexOf("heated")>-1 ? (parseFloat(document.getElementById("f-heatedcost").value)||0) : 0,
          vapeWeekly: substances.indexOf("vape")>-1 ? (parseFloat(document.getElementById("f-vape").value)||0) : 0,
          weedWeekly: substances.indexOf("weed")>-1 ? (parseFloat(document.getElementById("f-weed").value)||0) : 0,
          createdAt: Date.now()
        };
        var next = JSON.parse(JSON.stringify(state));
        next.people[id] = person;
        myId = id;
        try{ localStorage.setItem("aerCuratMyId_" + spaceId, id); }catch(e){}
        saveState(next);
      });
    }

    var relapseOpen = document.getElementById("relapse-open");
    if(relapseOpen) relapseOpen.addEventListener("click", function(){
      document.getElementById("relapse-confirm").hidden = false;
      relapseOpen.hidden = true;
    });
    var relapseCancel = document.getElementById("relapse-cancel-btn");
    if(relapseCancel) relapseCancel.addEventListener("click", function(){
      document.getElementById("relapse-confirm").hidden = true;
      document.getElementById("relapse-open").hidden = false;
    });
    var relapseConfirm = document.getElementById("relapse-confirm-btn");
    if(relapseConfirm) relapseConfirm.addEventListener("click", function(){
      var me = state.people[myId];
      if(!me) return;
      var days = elapsedParts(elapsedMs(me.quitDate)).days;
      var next = JSON.parse(JSON.stringify(state));
      next.relapses.push({personId: myId, streakDays: days, endedAt: new Date().toISOString()});
      next.people[myId].quitDate = new Date().toISOString();
      saveState(next);
    });

    document.querySelectorAll("[data-cheer]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-cheer"), 10);
        var preset = presetCheers()[idx];
        var target = otherPeople()[0];
        if(!target) return;
        var next = JSON.parse(JSON.stringify(state));
        next.cheers.push({id: uid("c_"), from: myId, to: target.id, msg: preset.t, at: new Date().toISOString()});
        if(next.cheers.length > 40) next.cheers = next.cheers.slice(-40);
        saveState(next);
      });
    });
  }

  render();
  setInterval(function(){ if(myId) render(); }, 60000);
</script>
</body>
</html>
